name: TAI CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tai-ci-\({{ github.workflow }}-\){{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Firestore rules lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Lint Firestore security rules
        run: bun run lint:rules

      - name: Build production app
        run: bun run build

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tai-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
